[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    --maxfail=2

markers =
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试
    skip_on_prod: 生产环境跳过
    schema: JSON Schema 校验测试
    chain: 接口关联测试

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning